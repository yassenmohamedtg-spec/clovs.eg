ansition:.2s}.hero-cta:hover{background:#ffffff35;transform:translateY(-2px)}.wrap{width:min(1180px,calc(100% - 44px));margin:auto}.catalog{padding:37px 0 50px}.toolbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,340px) auto;align-items:center;gap:20px;padding:0 0 19px;border-bottom:1px solid var(--line)}.eyebrow{color:var(--accent);letter-spacing:.06em}.toolbar h2{margin:6px 0 3px;font-size:clamp(23px,3vw,32px);letter-spacing:-.04em}.toolbar p{font-size:11px;color:var(--muted);margin:4px 0}.product-count{display:inline-flex;align-items:center;gap:5px}.searchbox{height:46px;display:flex;align-items:center;gap:9px;border:1px solid #e2e9e2;border-radius:13px;background:white;padding:0 14px;box-shadow:0 5px 15px #102d1510}.searchbox span{font-size:17px;color:#7c8a7f}.searchbox input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:12px;color:var(--ink)}.searchbox input::placeholder{color:#9aa59c}.cart-button,.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:13px;background:var(--accent-dark);color:#fff;padding:13px 17px;font-size:12px;font-weight:850;box-shadow:0 8px 18px #104b3520;transition:.2s}.cart-button:hover,.primary:hover{background:#0b3a29;transform:translateY(-1px)}.cart-button b{display:grid;place-items:center;min-width:23px;height:23px;border-radius:50%;background:#d8ecba;color:#173c2b;font-size:10px}.perks{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;padding:20px 0 23px}.perk{display:flex;align-items:center;gap:11px;padding:13px 15px;border:1px solid #e7ece5;border-radius:14px;background:#fff}.perk-icon{width:35px;height:35px;display:grid;place-items:center;flex:none;border-radius:11px;background:#edf5e9;color:var(--accent);font-size:16px}.perk strong{display:block;font-size:11px;margin-bottom:3px}.perk small{font-size:9px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px;padding:2px 0 20px}.card{overflow:hidden;border:1px solid #e7ece7;border-radius:18px;background:white;box-shadow:0 8px 24px #182e1a08;transition:transform .22s,box-shadow .22s,border-color .22s}.card:hover{transform:translateY(-4px);border-color:#d0e1d1;box-shadow:0 16px 36px #182e1a13}.image{height:clamp(180px,20vw,245px);position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(145deg,#f8faf7,#f1f4ef);padding:17px}.image img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;transition:transform .3s}.card:hover .image img{transform:scale(1.035)}.badge{position:absolute;top:12px;right:12px;border-radius:30px;padding:7px 10px;background:#fff;color:#9b4b3a;font-size:9px;font-weight:850;box-shadow:0 4px 12px #17251f10}.product-info{padding:13px 14px 14px}.product-info h3{min-height:43px;max-height:43px;overflow:hidden;font-size:12px;line-height:1.8;margin:0 0 4px;font-weight:850}.product-desc{height:34px;overflow:hidden;margin:0 0 12px;color:#829087;font-size:9px;line-height:1.8}.price-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:11px;border-top:1px solid #f0f2ef}.price-row strong{font-size:16px;color:#153d2d}.price-row small{font-size:9px;color:#7f8a81;font-weight:650}.add{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:0 11px;border:0;border-radius:10px;background:var(--accent-soft);color:var(--accent-dark);font-size:10px;font-weight:900;transition:.2s}.add:hover{background:#d9ebdb}.add:disabled{opacity:.45;cursor:not-allowed}.empty,.loading,.error{padding:44px 20px;border:1px dashed #cbd7cc;border-radius:16px;background:white;text-align:center;color:#66766b}.empty h2,.error h2{color:#203c2d}.filter-empty{display:none;margin:8px 0 24px;padding:30px;border:1px dashed #d0dbd1;border-radius:15px;background:#fff;text-align:center;color:var(--muted);font-size:12px}.error h2{color:#202b36}.footer{display:flex;justify-content:center;align-items:center;gap:13px;padding:22px;background:#123e30;color:#f3f7f3;font-size:10px}.footer small{color:#c5d5c9}.footer-brand{font-weight:900}.checkout{padding:28px 0 45px}.checkout-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:12px}.checkout-top h1{font-size:27px;margin:4px 0}.back,.qty{border:1px solid #dce5dc;border-radius:10px;background:#fff;padding:10px 13px;color:#344b3c;font-size:11px;font-weight:800}.back:hover,.qty:hover{border-color:#acc8af;background:#f8fbf7}.checkout-grid{display:grid;grid-template-columns:1fr 1fr;align-items:start;gap:17px}.box{background:#fff;border:1px solid #e5ebe5;border-radius:17px;padding:22px;box-shadow:0 12px 30px #172e1b08}.box h2{font-size:17px;margin:0 0 14px}.line{display:grid;grid-template-columns:58px minmax(0,1fr) 30px 20px 30px;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #eff2ee}.line img{width:56px;height:56px;object-fit:contain;background:#f5f7f4;border-radius:10px}.line strong{font-size:11px}.line small{display:block;font-size:9px;color:#737c88;margin-top:4px}.qty{width:30px;height:30px;padding:0;font-size:16px}.totals{margin-top:18px}.totals p,.totals>strong{display:flex;justify-content:space-between;gap:10px;margin:9px 0;font-size:12px}.totals>strong{border-top:1px solid #e8ede8;padding-top:13px;font-size:15px;color:#143e2d}.muted{font-size:11px;line-height:1.9;color:#718078}.field{display:block;margin:12px 0;color:#34463a;font-size:10px;font-weight:850}.field input,.field select,.field textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid #dfe7df;border-radius:10px;background:#fff;color:#17251f;font-size:12px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#6da07a;box-shadow:0 0 0 3px #17664713}.note{padding:12px;margin:15px 0;border-radius:11px;background:#eff6eb;color:#365a3c;font-size:10px;font-weight:750}.primary{width:100%;background:var(--accent);padding:14px}.primary:disabled{opacity:.5;cursor:not-allowed}.status{min-height:18px;font-size:11px;color:#69776e}.shade-modal{position:fixed;inset:0;z-index:99;background:#10251ab0;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:#fff;border:1px solid #ffffffaa;border-radius:20px;padding:21px;box-shadow:0 25px 70px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.modal-head h2{font-size:17px;margin:0}.close{border:0;background:#f0f3f0;width:34px;height:34px;border-radius:50%;font-size:19px;color:#344b3c}.modal img{width:100%;height:240px;object-fit:contain;background:linear-gradient(145deg,#f8faf7,#f1f4ef);border-radius:13px;margin:14px 0}.option{margin:12px 0}.option select{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #dce5dc;border-radius:9px}.toast{position:fixed;bottom:20px;left:50%;z-index:150;transform:translateX(-50%);padding:12px 17px;border-radius:12px;background:#123e30;color:white;font-size:11px;box-shadow:0 12px 35px #0003;max-width:calc(100vw - 32px)}

<body>
<div id="app" class="shop"><div class="loading">بنفتح المتجر...</div></div>
<div id="modal-host"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
const FIREBASE_CONFIG={apiKey:'AIzaSyCdH8Vu9vDRBxhMFhX3WO9GiyjSTcW8cZE',authDomain:'clovs-eg.firebaseapp.com',databaseURL:'https://clovs-eg-default-rtdb.firebaseio.com',projectId:'clovs-eg',storageBucket:'clovs-eg.firebasestorage.app',messagingSenderId:'949361459796',appId:'1:949361459796:web:8cee8082762ed71a9d23c1',measurementId:'G-KZ9KT0687T'};
if(!firebase.apps.length)firebase.initializeApp(FIREBASE_CONFIG);
const db=firebase.database(),auth=firebase.auth(),slug=String(new URL(location.href).searchParams.get('store')||'').normalize('NFKC').trim().toLowerCase();
const GOVERNORATES=['القاهرة','الجيزة','الإسكندرية','الدقهلية','الشرقية','القليوبية','البحيرة','الغربية','المنوفية','الفيوم','بني سويف','المنيا','أسيوط','سوهاج','قنا','أسوان','الأقصر','البحر الأحمر','السويس','الإسماعيلية','بورسعيد','دمياط','كفر الشيخ','مطروح','الوادي الجديد','شمال سيناء','جنوب سيناء'];
const SHIPPING_DEFAULT=Object.fromEntries(GOVERNORATES.map(g=>[g,(g==='القاهرة'||g==='الجيزة')?50:65]));
let store=null,products=[],cart=[],rates={...SHIPPING_DEFAULT},serviceUrl='',pending=false,pendingOrderKey='',toastTimer,productQuery='';
const app=document.getElementById('app');
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function money(v){return Number(v||0).toLocaleString('ar-EG',{maximumFractionDigits:2});}
function basePrice(p){let n=Number(p.price)||0,d=Number(p.discountPercent);if(Number.isFinite(d)&&d>0&&d<100)n*=1-d/100;return Math.round(n*100)/100;}
function img(p){let v=Array.isArray(p.images)?p.images[0]:p.images&&typeof p.images==='object'?Object.values(p.images)[0]:'';v=p.image||v||p.thumbnail||'';return /^https:\/\//i.test(v)?v:'https://placehold.co/600x600/f2f2f0/545b63?text=Product';}
function optionsOf(p){return Array.isArray(p.variants)?p.variants:Object.values(p.variants||{});}
function showToast(message){const t=document.getElementById('toast');t.textContent=message;t.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.add('hidden'),3800);}
async function loadStore(){
 if(!/^[a-z0-9\u0621-\u063a\u0641-\u064a-]{3,48}$/.test(slug)){return showError('رابط المتجر غير صالح','راجع الرابط الذي أرسله لك المسوق.');}
 try{
  const idx=await db.ref('storeSlugs/'+slug).once('value');if(!idx.exists())throw new Error('الرابط ده مش مربوط بمتجر محفوظ.');
  const snap=await db.ref('marketerStores/'+idx.val()).once('value');store=snap.val();if(!store||String(store.slug||'').normalize('NFKC').trim().toLowerCase()!==slug||store.enabled===false)throw new Error('المتجر غير منشور أو بيانات الرابط غير متطابقة.');
  rates={...SHIPPING_DEFAULT,...((await db.ref('siteSettings/shippingRates').once('value')).val()||{})};serviceUrl=String(((await db.ref('siteSettings/clovsV11').once('value')).val()||{}).serviceUrl||'').trim();
  const entries=Object.values(store.products||{});products=(await Promise.all(entries.map(async item=>{if(!item?.productId)return null;const p=await db.ref('products/'+item.productId).once('value');return p.exists()?{...p.val(),id:item.productId,storePrice:Number(item.price)}:null;}))).filter(Boolean);
  document.title=store.name+' | متجر مستقل';renderShop();
 }catch(e){console.error('[CLOVS external store]',e);showError('مش قادرين نفتح المتجر',e.message||'تأكد من رابط المتجر واتصال الإنترنت.');}
}
function showError(title,message){app.innerHTML=`<section class="wrap" style="padding:55px 0"><div class="error"><h2>${esc(title)}</h2><p>${esc(message)}</p><a href="./" style="display:inline-block;margin-top:12px;color:#a15b38;font-weight:800">العودة للموقع</a></div></section>`;}
function renderShop(){const cartCount=cart.reduce((n,x)=>n+x.quantity,0),desc=String(store.bio||'');app.innerHTML=`<div class="announcement"><span>توصيل لحد باب البيت</span><span>الدفع عند الاستلام</span><span>اطلب بسهولة ومن غير تسجيل</span></div><header class="hero">${store.coverUrl?`<img class="cover" src="${esc(store.coverUrl)}" alt="غلاف ${esc(store.name)}">`:''}<div class="shade"></div><div class="brand">${store.logoUrl?`<img class="logo" src="${esc(store.logoUrl)}" alt="لوجو ${esc(store.name)}">`:'<span class="logo-fallback">✦</span>'}<div class="brand-copy"><span class="kicker">تسوق من المتجر</span><h1>${esc(store.name)}</h1>${desc?`<p>${esc(desc)}</p>`:'<p>اختيارات مميزة وأسعار واضحة، وطلبك هيوصلك لحد باب البيت.</p>'}<a class="hero-cta" href="#catalog">اكتشف المنتجات <span>←</span></a></div></div></header><main class="wrap catalog" id="catalog"><div class="toolbar"><div><span class="eyebrow">تشكيلة مختارة بعناية</span><h2>اختار اللي يناسبك</h2><p class="product-count"><span id="product-count">${products.length}</span> منتج متاح في المتجر</p></div><label class="searchbox"><span>⌕</span><input type="search" placeholder="دور على منتج..." value="${esc(productQuery)}" oninput="filterProducts(this.value)" aria-label="ابحث عن منتج"></label><button class="cart-button" onclick="openCheckout()"><span>سلة الطلب</span><b>${cartCount}</b></button></div><div class="perks"><div class="perk"><span class="perk-icon">✓</span><div><strong>طلب سهل وسريع</strong><small>من غير إنشاء حساب</small></div></div><div class="perk"><span class="perk-icon">⌂</span><div><strong>توصيل لحد بابك</strong><small>اكتب عنوانك وقت الطلب</small></div></div><div class="perk"><span class="perk-icon">ج</span><div><strong>الدفع عند الاستلام</strong><small>ادفع بعد ما تستلم طلبك</small></div></div></div><section class="grid" id="product-grid">${products.map(p=>{const available=Number(p.stock)>0&&p.storePrice>=basePrice(p),description=String(p.desc||p.description||'منتج مختار بعناية من المتجر.'),search=esc(String(p.name||'')+' '+description);return `<article class="card" data-search="${search}"><div class="image"><img src="${esc(img(p))}" alt="${esc(p.name)}" loading="lazy">${available?'':'<span class="badge">غير متاح حاليًا</span>'}</div><div class="product-info"><h3>${esc(p.name)}</h3><p class="product-desc">${esc(description)}</p><div class="price-row"><strong>${money(p.storePrice)} <small>ج.م</small></strong><button class="add" ${available?'':'disabled'} onclick="openProduct('${esc(p.id)}')" aria-label="اختيار ${esc(p.name)}"><span>اختار المنتج</span><span>＋</span></button></div></div></article>`;}).join('')}</section><div id="filter-empty" class="filter-empty">ملقيناش منتج بالاسم ده. جرّب كلمة تانية.</div>${products.length?'':'<div class="empty"><h2>المتجر بيجهّز منتجاته</h2><p>ارجع قريبًا وشوف المنتجات الجديدة.</p></div>'}</main><footer class="footer"><span class="footer-brand">${esc(store.name)}</span><span>طلبك من غير تسجيل</span><small>إدارة الطلبات عبر CLOVS</small></footer>`;filterProducts(productQuery);}
function filterProducts(value){productQuery=String(value||'');const q=productQuery.trim().toLocaleLowerCase('ar'),cards=[...document.querySelectorAll('#product-grid .card')];let shown=0;cards.forEach(card=>{const match=!q||card.dataset.search.toLocaleLowerCase('ar').includes(q);card.style.display=match?'':'none';if(match)shown++;});const count=document.getElementById('product-count'),empty=document.getElementById('filter-empty');if(count)count.textContent=shown;if(empty)empty.style.display=cards.length&&shown===0?'block':'none';}
function openProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const opts=optionsOf(p);document.getElementById('modal-host').innerHTML=`<div class="shade-modal" onclick="if(event.target===this)closeProduct()"><div class="modal"><div class="modal-head"><h2>${esc(p.name)}</h2><button class="close" onclick="closeProduct()">×</button></div><img src="${esc(img(p))}" alt="${esc(p.name)}"><p class="muted">${esc(p.desc||'')}</p><strong>${money(p.storePrice)} ج.م</strong>${opts.map((v,i)=>`<label class="field option">${esc(v.name)}<select data-option="${i}"><option value="">اختار ${esc(v.name)}</option>${(Array.isArray(v.options)?v.options:Object.values(v.options||{})).map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></label>`).join('')}<button class="primary" style="margin-top:14px" onclick="addProduct('${esc(p.id)}')">أضف للسلة</button></div></div>`;}
function closeProduct(){document.getElementById('modal-host').innerHTML='';}
function addProduct(id){const p=products.find(x=>x.id===id);if(!p)return;const selected={};for(const [i,v] of optionsOf(p).entries()){const value=document.querySelector(`[data-option="${i}"]`)?.value||'';if(!value)return showToast('اختار كل خيارات المنتج');selected[v.name]=value;}if(Number(p.stock)<1||p.storePrice<basePrice(p))return showToast('المنتج غير متاح حاليًا بهذا السعر');const current=cart.reduce((n,x)=>n+(x.productId===id?x.quantity:0),0);if(current>=Number(p.stock))return showToast('الكمية المطلوبة أكبر من المخزون');if(cart.length>=30)return showToast('الحد الأقصى 30 صنفًا في الطلب');const found=cart.find(x=>x.productId===id&&JSON.stringify(x.selectedVariants)===JSON.stringify(selected));if(found)found.quantity++;else cart.push({productId:id,quantity:1,selectedVariants:selected});pendingOrderKey='';closeProduct();renderShop();showToast('اتضاف للسلة');}
function subtotal(){return round(cart.reduce((n,i)=>n+(products.find(p=>p.id===i.productId)?.storePrice||0)*i.quantity,0));}
function round(v){return Math.round((Number(v)+Number.EPSILON)*100)/100;}
function openCheckout(){renderCheckout();}
function renderCheckout(){const c=window.customerData||{name:'',phone:'',alternatePhone:'',address:'',landmark:'',notes:'',governorate:'القاهرة'};window.customerData=c;const ship=Number(rates[c.governorate]??SHIPPING_DEFAULT[c.governorate]);app.innerHTML=`<main class="wrap checkout"><div class="checkout-top"><button class="back" onclick="renderShop()">رجوع للمتجر</button><div><span class="eyebrow">${esc(store.name)}</span><h1>إتمام الطلب</h1></div></div><div class="checkout-grid"><section class="box"><h2>مراجعة السلة</h2>${cart.map((i,index)=>{const p=products.find(x=>x.id===i.productId);return `<div class="line"><img src="${esc(img(p||{}))}" alt=""><div><strong>${esc(p?.name||'منتج')}</strong><small>${money(p?.storePrice||0)} ج.م${Object.entries(i.selectedVariants||{}).length?' · '+esc(Object.entries(i.selectedVariants).map(([k,v])=>k+': '+v).join('، ')):''}</small></div><button class="qty" onclick="changeQty(${index},-1)">−</button><span>${i.quantity}</span><button class="qty" onclick="changeQty(${index},1)">+</button></div>`;}).join('')||'<p class="muted">السلة فارغة. ارجع للمتجر واختار منتجاتك.</p>'}<div class="totals"><p>قيمة المنتجات <b>${money(subtotal())} ج.م</b></p><p>الشحن <b>${money(ship)} ج.م</b></p><strong>الإجمالي <b>${money(subtotal()+ship)} ج.م</b></strong></div></section><form class="box" onsubmit="submitOrder(event)"><h2>بيانات التوصيل</h2><p class="muted">اطلب كضيف من غير تسجيل أو إنشاء حساب.</p>${[['name','اسم المستلم','text',100],['phone','رقم الهاتف','tel',11],['alternatePhone','هاتف إضافي (اختياري)','tel',11],['address','العنوان بالتفصيل','text',300],['landmark','علامة مميزة (اختياري)','text',180],['notes','ملاحظات للمندوب (اختياري)','text',500]].map(([k,label,type,max])=>`<label class="field">${label}<input ${['name','phone','address'].includes(k)?'required':''} type="${type}" maxlength="${max}" value="${esc(c[k])}" oninput="customerData.${k}=this.value"></label>`).join('')}<label class="field">المحافظة<select required onchange="customerData.governorate=this.value;renderCheckout()">${GOVERNORATES.map(g=>`<option ${g===c.governorate?'selected':''} value="${esc(g)}">${esc(g)}</option>`).join('')}</select></label><div class="note">الدفع عند الاستلام. فريق المتجر هيتواصل معاك لتأكيد الطلب.</div><button class="primary" ${cart.length?'':'disabled'} ${pending?'disabled':''}>تأكيد الطلب</button><p id="status" class="status" role="status"></p></form></div></main><footer class="footer"><span>${esc(store.name)}</span><small>إدارة الطلبات عبر CLOVS</small></footer>`;}
function changeQty(index,delta){const i=cart[index],p=products.find(x=>x.id===i?.productId);if(!i)return;if(delta>0&&(!p||cart.reduce((n,x)=>n+(x.productId===i.productId?x.quantity:0),0)>=Number(p.stock)))return showToast('الكمية غير متاحة');i.quantity+=delta;if(i.quantity<=0)cart.splice(index,1);pendingOrderKey='';renderCheckout();}
function labelData(order){const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d');canvas.width=900;canvas.height=520+order.items.length*62;ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#222c38';ctx.fillRect(0,0,canvas.width,100);ctx.fillStyle='#fff';ctx.font='bold 38px Tahoma';ctx.textAlign='right';ctx.direction='rtl';ctx.fillText('بوليصة شحن · '+store.name,canvas.width-36,63);ctx.fillStyle='#1b2430';ctx.font='bold 24px Tahoma';let y=150;const lines=['رقم الطلب: '+order.id,'المستلم: '+order.customer.name,'الهاتف: '+order.customer.phone,'المحافظة: '+order.customer.governorate,'العنوان: '+order.customer.address,'محتويات الطلب:'];for(const line of lines){ctx.fillText(line,canvas.width-38,y);y+=43;}order.items.forEach((it,i)=>{ctx.font='20px Tahoma';ctx.fillText((i+1)+'. '+it.product.name+' — عدد '+it.quantity,canvas.width-38,y);y+=45;});ctx.font='bold 22px Tahoma';ctx.fillText('الإجمالي: '+money(order.grandTotal)+' جنيه — الدفع عند الاستلام',canvas.width-38,y+15);return canvas.toDataURL('image/png');}
async function service(action,data){if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(serviceUrl))throw new Error('خدمة الطلبات غير مربوطة في إعدادات CLOVS.');let user=auth.currentUser;if(!user){try{user=(await auth.signInAnonymously()).user;}catch(error){if(error?.code==='auth/operation-not-allowed')throw new Error('فعّل Anonymous في Firebase Authentication عشان العميل يطلب كضيف.');throw error;}}const idToken=await user.getIdToken();const response=await fetch(serviceUrl,{method:'POST',body:new URLSearchParams({payload:JSON.stringify({action,data,idToken})}),redirect:'follow',credentials:'omit'});const result=await response.json();if(!result.success)throw new Error(result.message||'تعذر تنفيذ الطلب');return result;}
async function submitOrder(e){e.preventDefault();if(pending||!cart.length)return;const button=e.submitter||e.target.querySelector('button[type="submit"],button.primary'),status=document.getElementById('status');pending=true;if(button)button.disabled=true;if(status)status.textContent='بنراجع الطلب وبنسجله...';try{const customer={...window.customerData},latest=(await db.ref('marketerStores/'+store.ownerUid).once('value')).val();if(!latest||latest.enabled===false)throw new Error('المتجر غير متاح حاليًا');store=latest;const fresh=await Promise.all(cart.map(async i=>{const snap=await db.ref('products/'+i.productId).once('value');if(!snap.exists())throw new Error('أحد المنتجات لم يعد متاحًا.');const p=snap.val(),entry=store.products?.[i.productId];if(!entry)throw new Error('أحد المنتجات أُزيل من المتجر.');return {...p,id:i.productId,storePrice:Number(entry.price)};}));products=Array.from(new Map([...products,...fresh].map(p=>[p.id,p])).values());const subtotalValue=round(cart.reduce((n,i)=>{const p=fresh.find(x=>x.id===i.productId);return n+(p?.storePrice||0)*i.quantity;},0)),shipping=round(Number(rates[customer.governorate]??SHIPPING_DEFAULT[customer.governorate])),orderKey=pendingOrderKey||(pendingOrderKey=db.ref('orders').push().key),items=cart.map(i=>({product:fresh.find(p=>p.id===i.productId),quantity:i.quantity,selectedVariants:i.selectedVariants,commission:round(fresh.find(p=>p.id===i.productId).storePrice-basePrice(fresh.find(p=>p.id===i.productId)))})),order={id:'ORD-'+orderKey,createdAt:Date.now(),customer,items,subtotal:subtotalValue,shippingRate:shipping,grandTotal:round(subtotalValue+shipping),marketerName:store.name,marketerPageName:store.name};await service('storeOrder',{storeSlug:slug,orderKey,items:cart,customer,paymentMethod:'cod',paymentProof:{},shippingLabelData:labelData(order),expectedGrandTotal:order.grandTotal});pendingOrderKey='';cart=[];window.customerData={name:'',phone:'',alternatePhone:'',address:'',landmark:'',notes:'',governorate:'القاهرة'};app.innerHTML=`<main class="wrap" style="padding:65px 0"><div class="empty"><h1>وصلنا طلبك بنجاح 🎉</h1><p>رقم الطلب <b>ORD-${esc(orderKey)}</b></p><p>الإجمالي ${money(order.grandTotal)} جنيه. هنتواصل معاك لتأكيد التوصيل.</p><button class="primary" style="max-width:250px;margin:12px auto" onclick="renderShop()">العودة للمتجر</button></div></main><footer class="footer">${esc(store.name)} · إدارة الطلبات عبر CLOVS</footer>`;}catch(error){console.error('[CLOVS guest order]',error);if(status)status.textContent=error.message||'تعذر تسجيل الطلب';showToast(error.message||'تعذر تسجيل الطلب');}finally{pending=false;if(button&&button.isConnected)button.disabled=false;}}
loadStore();
</script>
